name: E2E (real DeepSeek API)

# Real-API coverage is optional for a public DeepCode checkout. Keyless quality
# gates run in ci.yml; this workflow executes only when the repository configures
# DEEPSEEK_API_KEY_EXTERNAL. Fork and Dependabot pull requests never receive it.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e
    if: >-
      github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    timeout-minutes: 45
    steps:
      # GitHub does not allow secrets directly in an `if:` expression. This
      # step exposes only a boolean output and never prints the credential.
      - name: Detect optional DeepSeek API credential
        id: deepseek-api
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Real-API E2E not run: configure DEEPSEEK_API_KEY_EXTERNAL to enable it."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.deepseek-api.outputs.available == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.deepseek-api.outputs.available == 'true'

      - uses: actions/setup-node@v6
        if: steps.deepseek-api.outputs.available == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        if: steps.deepseek-api.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install bubblewrap (unrestrict userns)
        if: steps.deepseek-api.outputs.available == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent; the functional probe decides"

      - name: Build (lib for the e2e example bins)
        if: steps.deepseek-api.outputs.available == 'true'
        run: pnpm run build

      - name: E2E tests (real DeepSeek API)
        if: steps.deepseek-api.outputs.available == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 14
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
