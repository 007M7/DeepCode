version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
    ignore:
      # knip 6.17+ changed configuration semantics incompatibly with the
      # repo's knip.json (workspace overrides, built-in binaries). Minor
      # bumps are reviewed manually; patches still flow.
      - dependency-name: "knip"
        update-types:
          - "version-update:semver-minor"
      # oxlint 1.77 breaks the lint contract: it leaks DEBUG logs into
      # stdout and stops linting explicitly staged paths. Revisit when
      # upstream fixes both regressions.
      - dependency-name: "oxlint"
        update-types:
          - "version-update:semver-minor"
      # @vitejs/plugin-react is pinned to ^5.2.0: the 6.x line requires
      # vite 7 while the repo is on vite 6. Revisit when vite is bumped.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      # ink 6+ requires React 19; cli-app pins ink 5.2.1 + react 18.3.1.
      # The React major upgrade must land first, in one reviewed change —
      # so react, react-dom, and their @types are ignored for majors too.
      - dependency-name: "ink"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      # The 0.x -> 1.x jump is a protocol SDK major; review the API surface
      # manually before crossing it.
      - dependency-name: "@agentclientprotocol/sdk"
        update-types:
          - "version-update:semver-major"
      # vite majors move the whole toolchain (vitest, @vitejs/plugin-react,
      # web build) together; the repo sits on the vite 6 line that the
      # plugin-react ^5.2.0 pin requires.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      # chokidar 5 is a file-watcher major; review its API changes manually.
      - dependency-name: "chokidar"
        update-types:
          - "version-update:semver-major"
      # @types/node majors must track the Node.js runtime line the repo
      # builds against, not jump ahead of it.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
