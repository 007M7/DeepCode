# Git hooks (lefthook). Pre-commit keeps commit-local checks fast; pre-push
# runs the primary Node CI inventory before publication.
# Install: `pnpm exec lefthook install` (runs automatically via postinstall).

pre-commit:
  jobs:
    - name: lint (staged)
      glob: '*.{ts,mts,cts,mjs}'
      exclude:
        - 'vendor/*/src/**'
      run: node_modules/.bin/eslint --fix {staged_files}
      stage_fixed: true

    - name: whitespace (staged)
      run: git diff --cached --check

    - name: vendor manifest guard
      run: scripts/check-vendor-manifest.sh

pre-push:
  jobs:
    - name: primary CI
      run: pnpm run check:pre-push
