# Test-only composition: one human turn creates a goal, then the driver runs two rounds.
- id: scripted-llm
  name: './scripted-llm.ts'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: goal-session
  name: '@deepseek-ai/dsh-goal-session'

- id: stdio-agent
  name: '@deepseek-ai/dsh-stdio-demo'
  config:
    provider: goal-session-script
    model: goal-session-script
    persona: 'Execute the deterministic same-session goal-round proof.'
    welcome: 'goal-session e2e ready.'
    persistenceRoot: './.sessions'
    workspaceContext: false
