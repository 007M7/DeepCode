# POC overlay: keep the advanced headless agent and model-facing tools, but
# place its filesystem, processes, terminals, language servers, and Code Mode
# execution in one short-lived E2B sandbox.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./advanced.cordis.yml
    patches:
      - id: subprocess
        name: '@deepseek-ai/dsh-subprocess-local'
        disabled: true
      - id: fs-local
        name: '@deepseek-ai/dsh-fs-local'
        disabled: true
      - id: code-runtime
        name: '@deepseek-ai/dsh-code-runtime-worker'
        disabled: true
      - id: bash
        name: '@deepseek-ai/dsh-bash-local'
        config:
          cwd: !!js process.cwd()
          timeoutMs: 60000
      - insert:
          - id: e2b
            name: '@deepseek-ai/dsh-e2b'
            config:
              cwd: !!js process.cwd()
              timeoutMs: 300000
              onTimeout: kill
              onDispose: kill
          - id: subprocess-e2b
            name: '@deepseek-ai/dsh-subprocess-e2b'
          - id: fs-e2b
            name: '@deepseek-ai/dsh-fs-e2b'
          - id: code-runtime-e2b
            name: '@deepseek-ai/dsh-code-runtime-e2b'
          - id: pty
            name: '@deepseek-ai/dsh-pty'
          - id: pty-e2b
            name: '@deepseek-ai/dsh-pty-e2b'
          - id: tool-pty
            name: '@deepseek-ai/dsh-tool-pty'
          - id: lsp
            name: '@deepseek-ai/dsh-lsp'
          - id: lsp-e2b
            name: '@deepseek-ai/dsh-lsp-e2b'
            config:
              servers:
                typescript:
                  command: npx
                  args: [--yes, typescript-language-server@5.0.0, --stdio]
                  extensionToLanguage:
                    .ts: typescript
                    .tsx: typescriptreact
                    .js: javascript
                    .jsx: javascriptreact
          - id: tool-lsp
            name: '@deepseek-ai/dsh-tool-lsp'
