# Add Code Mode and Cordis tools to the headless spawn/workflow stack.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: cli-agent
        name: '@deepseek-ai/dsh-cli-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-pro
          persistenceRoot: './.sessions'
          persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@deepseek-ai/dsh-code-runtime-worker'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
