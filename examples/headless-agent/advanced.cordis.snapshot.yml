# Replay counterpart to advanced.cordis.yml; only the live model is replaced.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./advanced.cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
