# Keyless counterpart to e2b.cordis.yml. It keeps the same generic PTY, LSP,
# and subprocess Code Runtime consumers, but supplies their fundamental
# filesystem/process world locally and replaces the live model with replay.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: cli-agent
        name: '@deepseek-ai/dsh-cli-demo'
        config:
          provider: deepseek
          model: deepseek-v4-pro
          persistenceRoot: './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime-subprocess
            name: '@deepseek-ai/dsh-code-runtime-subprocess'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: sandbox-policy
            name: '@deepseek-ai/dsh-sandbox-policy'
            config:
              mode: danger-full-access
              workspaceRoot: !!js process.cwd()
          - id: pty
            name: '@deepseek-ai/dsh-pty'
          - id: pty-local
            name: '@deepseek-ai/dsh-pty-local'
          - id: tool-pty
            name: '@deepseek-ai/dsh-tool-pty'
          - id: lsp
            name: '@deepseek-ai/dsh-lsp'
          - id: lsp-local
            name: '@deepseek-ai/dsh-lsp-local'
            config:
              servers:
                typescript:
                  command: node
                  extensionToLanguage:
                    .ts: typescript
          - id: tool-lsp
            name: '@deepseek-ai/dsh-tool-lsp'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
