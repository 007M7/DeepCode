- id: cli-mock-llm
  name: './cli-mock-llm.ts'

- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: cli-agent
        name: '@deepseek-ai/dsh-cli-demo'
        config:
          provider: cli-mock
          model: cli-mock
          persistenceRoot: './.sessions'
          workspaceContext: false
          persona: 'Keyless headless-agent smoke.'
