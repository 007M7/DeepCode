# Replay the advanced toolchain through the headless one-shot front door. It
# receives this replay config explicitly; unlike the ACP bin, it does not swap
# a live config for a sibling snapshot overlay.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        disabled: true
      - insert:
          - id: cli-agent
            name: '@deepseek-ai/dsh-cli-demo'
            config:
              model: deepseek-v4-flash
              persistenceRoot: './.sessions'
              tools:
                mode: both
              persona: |
                You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

                Verify your work by running the code or tests. Keep answers brief and factual.
          - id: code-runtime
            name: '@deepseek-ai/dsh-code-runtime-worker'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
