# Parallel-read snapshot composition. The default ACP example omits direct
# filesystem tools under its confined deployment; this overlay explicitly
# enables the provider, policy, and tools so the authored scenario exercises
# two safe sibling calls through the real front door.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: fs-local
        name: '@deepseek-ai/dsh-fs-local'
        disabled: false
      - id: fs-policy
        name: '@deepseek-ai/dsh-fs-policy'
        disabled: false
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        disabled: false
