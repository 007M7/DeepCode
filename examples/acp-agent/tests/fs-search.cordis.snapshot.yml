# Minimal keyless composition: real app, bash, and search tool; replayed model.
- id: llm-replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    providers:
      - id: deepseek-official
        name: DeepSeek
        models:
          - id: deepseek-v4-pro

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    # Unpacked rows: the eager-drain batch boundaries that split packed delta
    # runs are timing-dependent, so packed logs cannot replay-match a live
    # record of a long reasoning stream.
    packChunks: false
    workspaceContext: false
    skills:
      enabled: false
    toolTasks: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4
