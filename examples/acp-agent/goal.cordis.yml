# Add the persisted same-session goal stack to the shipped ACP app.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@deepseek-ai/dsh-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: goal-session
            name: '@deepseek-ai/dsh-goal-session'
