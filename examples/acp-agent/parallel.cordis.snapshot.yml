# Keyless counterpart to parallel.cordis.yml: force-enable direct filesystem
# tools and replace the live adapter with the recorded replay provider.
- id: base
  name: '@cordisjs/plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: fs-local
        name: '@deepseek-ai/dsh-fs-local'
        disabled: false
      - id: fs-policy
        name: '@deepseek-ai/dsh-fs-policy'
        disabled: false
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        disabled: false
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
